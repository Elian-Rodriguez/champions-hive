name: champion-hive

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    image: ${IMAGE:-ghcr.io/elian-rodriguez/champions-hive:latest}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    env_file:
      - .env
    volumes:
      - champion_data:/data        # persistencia para SQLite (si se usa)
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-champion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-champion}
      POSTGRES_DB: ${POSTGRES_DB:-champion_hive}
    volumes:
      - champion_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-champion}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  champion_data:
  champion_db:
