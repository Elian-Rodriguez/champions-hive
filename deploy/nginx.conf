server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Subidas. Los escudos y banners son chicos (data URI de pocos KB), pero
    # los clips de las mejores jugadas llegan a MAX_VIDEO_MB (40 por defecto) y
    # el multipart agrega su parte, así que el tope va holgado por encima.
    client_max_body_size 60m;

    # --- Clips de las mejores jugadas, servidos desde disco ---
    # Atajo: nginx entrega el video sin pasarlo por uvicorn (que para un
    # archivo de 30 MB es puro desperdicio) y responde Range, que es lo que
    # necesita un <video> para adelantar. Si la carpeta no está donde dice
    # —porque MEDIA_ROOT apunta a otro sitio— cae en @api y lo sirve el
    # backend, que es la ruta que siempre funciona.
    location /api/v1/media/ {
        alias /data/media/;
        try_files $uri @api;
        expires 7d;
        add_header Cache-Control "public";
        # El nombre del archivo lo pone el servidor (uuid + extensión de lista
        # blanca), pero nosniff es gratis y cierra la puerta a que el navegador
        # adivine otro tipo y ejecute algo en nuestro propio dominio.
        add_header X-Content-Type-Options "nosniff";
    }

    location @api {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- API del backend (FastAPI / uvicorn) ---
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Docs / OpenAPI del backend ---
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Activos estáticos con cache larga ---
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- SPA (React) con fallback de rutas del cliente ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
