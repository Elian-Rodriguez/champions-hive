[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

# API FastAPI — escucha solo en localhost; nginx hace de frente público.
#
# --proxy-headers hace que uvicorn tome la IP del cliente de X-Forwarded-For
# (que nginx ya manda) en vez de la de la conexión, que aquí es siempre
# 127.0.0.1. Sin esto el limitador de peticiones —que va por IP— trata a toda
# la plataforma como un solo visitante: diez intentos fallidos de login de
# cualquiera dejarían fuera a todos, y cinco enlaces de recuperación por hora
# serían cinco en total y no cinco por persona. --forwarded-allow-ips limita
# esa confianza al proxy local, para que nadie falsee su IP desde fuera.
[program:uvicorn]
directory=/app/backend
command=uvicorn app.main:app --host 127.0.0.1 --port 8000 --proxy-headers --forwarded-allow-ips=127.0.0.1
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Nginx — sirve la SPA y hace proxy reverso de la API.
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
